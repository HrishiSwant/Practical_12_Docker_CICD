name: Practical 13 CI/CD Pipeline

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main


jobs:

  build-and-test:

    runs-on: ubuntu-latest

    steps:

      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Student Service Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r student-service/requirements.txt

      - name: Install Course Service Dependencies
        run: |
          pip install -r course-service/requirements.txt

      - name: Install API Gateway Dependencies
        run: |
          pip install -r api-gateway/requirements.txt

      - name: Check Python Files
        run: |
          python -m py_compile student-service/app/main.py
          python -m py_compile course-service/app/main.py
          python -m py_compile api-gateway/app/main.py

      - name: Build Docker Images
        run: |
          docker compose build

      - name: CI Pipeline Successful
        run: echo "CI/CD pipeline completed successfully"